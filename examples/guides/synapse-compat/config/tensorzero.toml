# Synapse-compatible OpenAI entry: callers send bare alias names
# (e.g. `deepseek-v4-flash`) plus `x-synapse-*` headers.
#
# These aliases are public model names only. Do not add Merlin / cluster
# internals here. Override api bases with env vars:
#   ALIBABA_BASE_URL, ALIBABA_RERANK_BASE_URL, SILICONFLOW_BASE_URL,
#   VOLCENGINE_BASE_URL, DEEPSEEK_BASE_URL, MIMO_BASE_URL, OPENROUTER_BASE_URL

[gateway.observability]
enabled = true
backend = "postgres"

[model_aliases.deepseek-v4-flash]
task = "chat"
min_tokens_per_sec = 10.0
targets = [
    { provider = "deepseek", model = "deepseek-v4-flash" },
    { provider = "alibaba", model = "deepseek-v4-flash" },
]

[model_aliases.deepseek-v4-pro]
task = "chat"
targets = [
    { provider = "deepseek", model = "deepseek-v4-pro" },
    { provider = "alibaba", model = "deepseek-v4-pro" },
]

[model_aliases.qwen3-embedding-4b]
task = "embedding"
targets = [
    { provider = "openrouter", model = "qwen/qwen3-embedding-4b" },
    { provider = "siliconflow", model = "Qwen/Qwen3-Embedding-4B" },
]

[model_aliases.qwen3-rerank]
task = "rerank"
targets = [
    { provider = "alibaba", model = "qwen3-rerank" },
]

# Dotted alias names must be quoted. Unquoted `[model_aliases.glm-5.1]`
# is nested table `glm-5` + field `1`.
[model_aliases."glm-5.1"]
task = "chat"
targets = [{ provider = "alibaba", model = "glm-5.1" }]

[model_aliases."glm-5.2"]
task = "chat"
targets = [{ provider = "alibaba", model = "glm-5.2" }]

[model_aliases."kimi-k2.6"]
task = "chat"
targets = [{ provider = "alibaba", model = "kimi-k2.6" }]

# Xiaomi MiMo (OpenAI-compatible). Shorthand `mimo::mimo-v2.6-pro` also works
# with MIMO_API_KEY. Responses `text.format` supports json_object only;
# json_schema is sent over chat completions by the mimo shorthand.
[model_aliases.mimo-v2.6-pro]
task = "chat"
targets = [{ provider = "mimo", model = "mimo-v2.6-pro" }]

[model_aliases.mimo-v2.6-flash]
task = "chat"
targets = [{ provider = "mimo", model = "mimo-v2.6-flash" }]

# TypeSafe Jev via OpenRouter System One (`POST /v1/systemone`).
# Bare `jev` / `jev-latest` also resolve without this table.
[model_aliases.jev]
task = "systemone"
targets = [{ provider = "openrouter", model = "~typesafe/jev-latest" }]

[model_aliases."jev-latest"]
task = "systemone"
targets = [{ provider = "openrouter", model = "~typesafe/jev-latest" }]

[model_aliases."jev-1.13"]
task = "systemone"
targets = [{ provider = "openrouter", model = "typesafe/jev-1.13" }]
