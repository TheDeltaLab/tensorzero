name: Publish TypeScript SDK

permissions: {}

on:
  push:
    tags:
      - "sdk/ts/v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @delta-ai packages to npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publisher on npmjs is configured for this repo + this workflow
    # filename + this environment.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@delta-ai"
          package-manager-cache: false

      # npm trusted publishing requires npm CLI >= 11.5.1; Node 22 ships
      # npm 10, so upgrade explicitly.
      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      # `pnpm pack` rewrites the `workspace:*` dependency of
      # @delta-ai/ai-sdk-provider on @delta-ai/tensorzero-sdk into the real
      # version number; `npm publish` then publishes the tarballs with OIDC
      # trusted publishing. Publish the SDK first so the provider's dependency
      # resolves on the registry.
      - name: Pack packages
        run: |
          pnpm --filter @delta-ai/tensorzero-sdk pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter @delta-ai/ai-sdk-provider pack --pack-destination "$RUNNER_TEMP"
          ls -1 "$RUNNER_TEMP"/*.tgz

      # setup-node's registry-url writes an `_authToken` placeholder into
      # ~/.npmrc; a configured (even empty) token shadows OIDC trusted
      # publishing, so strip it before publishing.
      - name: Clear token auth from npmrc
        run: sed -i '/_authToken/d' ~/.npmrc || true

      - name: Publish @delta-ai/tensorzero-sdk
        working-directory: ${{ runner.temp }}
        run: npm publish ./delta-ai-tensorzero-sdk-*.tgz

      - name: Publish @delta-ai/ai-sdk-provider
        working-directory: ${{ runner.temp }}
        run: npm publish ./delta-ai-ai-sdk-provider-*.tgz
