# Publish gateway and UI images to GHCR for TheDeltaLab/tensorzero.
# Upstream Docker Hub publish is gated on tensorzero/tensorzero and does not run here.

name: Publish GHCR images

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-ghcr.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        type: boolean
        default: true

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  gateway:
    name: Build gateway
    if: github.repository == 'TheDeltaLab/tensorzero'
    # Self-hosted runner (CI builder VM, data disk on /mnt/runner) with host-disk build cache.
    runs-on: tensorzero-ci
    timeout-minutes: 90
    permissions:
      contents: read # Required for checkout or repository metadata reads.
      packages: write # Required to publish package or container metadata.
      id-token: write # Required for OIDC-backed build or publish tooling.
      attestations: write # Required to publish artifact attestations.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Persistent named builder so BuildKit state (including the RUN --mount=type=cache
      # cargo caches in the Dockerfiles) survives across runs on this machine.
      - name: Set up buildx
        run: |
          docker version
          docker buildx create --name tz-builder --driver docker-container --use --bootstrap 2>/dev/null || docker buildx use tz-builder
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/thedeltalab/tensorzero/gateway
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: crates/gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/mnt/runner/buildx-cache/tensorzero/gateway
          cache-to: type=local,dest=/mnt/runner/buildx-cache/tensorzero/gateway,mode=max

  ui:
    name: Build UI
    if: github.repository == 'TheDeltaLab/tensorzero'
    # Self-hosted runner (CI builder VM, data disk on /mnt/runner) with host-disk build cache.
    runs-on: tensorzero-ci
    timeout-minutes: 90
    permissions:
      contents: read # Required for checkout or repository metadata reads.
      packages: write # Required to publish package or container metadata.
      id-token: write # Required for OIDC-backed build or publish tooling.
      attestations: write # Required to publish artifact attestations.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Persistent named builder so BuildKit state (including the RUN --mount=type=cache
      # cargo caches in the Dockerfiles) survives across runs on this machine.
      - name: Set up buildx
        run: |
          docker version
          docker buildx create --name tz-builder --driver docker-container --use --bootstrap 2>/dev/null || docker buildx use tz-builder
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/thedeltalab/tensorzero/ui
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/mnt/runner/buildx-cache/tensorzero/ui
          cache-to: type=local,dest=/mnt/runner/buildx-cache/tensorzero/ui,mode=max
