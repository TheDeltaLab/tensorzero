# Publish gateway and UI images to GHCR for TheDeltaLab/tensorzero.
# Upstream Docker Hub publish is gated on tensorzero/tensorzero and does not run here.

name: Publish GHCR images

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-ghcr.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        type: boolean
        default: true

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  gateway:
    name: Build gateway
    if: github.repository == 'TheDeltaLab/tensorzero'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/thedeltalab/tensorzero/gateway
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ui:
    name: Build UI
    if: github.repository == 'TheDeltaLab/tensorzero'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/thedeltalab/tensorzero/ui
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
