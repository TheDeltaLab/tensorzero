[package]
name = "tensorzero"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[test]]
name = "client_tests"
path = "tests/tests.rs"
required-features = ["e2e_tests"]

[dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio-stream = { workspace = true }
tensorzero-core = { path = "../tensorzero-core", default-features = false }
tensorzero-inference-types = { path = "../tensorzero-inference-types" }
url = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
mime = { workspace = true }
tempfile = { workspace = true }
paste = { version = "1.0.15", optional = true }
lazy_static = { workspace = true }
reqwest-sse-stream = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
clap = { workspace = true }
lazy_static = { workspace = true }
tokio = { workspace = true }
tracing = "0.1.43"
tracing-subscriber = "0.3.23"
toml = { workspace = true }

[features]
# Provider integration features (forwarded to `tensorzero-core`). On by
# default so existing builds are unchanged.
default = []
aws = ["tensorzero-core/aws"]
google = ["tensorzero-core/google"]
# Forward this feature to 'tensorzero-core', so that our embedded
# client can recognize things like the `dummy` provider
e2e_tests = ["tensorzero-core/e2e_tests", "dep:paste"]
