[package]
name = "tensorzero-otel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
e2e_tests = []
# 内部观测规范集成（《日志规范》delta-observability 薄 crate，私有 git 依赖）。
# 默认关闭：公开构建不解析/不下载私有依赖、行为与上游一致；内部构建用
# `--features internal-observability` 启用（需 TheDeltaLab 仓库读取凭据）。
internal-observability = ["dep:delta-observability"]

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
delta-observability = { workspace = true, optional = true }
futures = { workspace = true }
http = { workspace = true }
init-tracing-opentelemetry = { workspace = true }
metrics = "0.24.6"
metrics-exporter-prometheus = { workspace = true }
moka = { workspace = true }
once_cell = "1.21.4"
opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tensorzero-overhead = { path = "../tensorzero-overhead" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { version = "0.14.6", default-features = false }
tracing = { workspace = true }
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
tracing-opentelemetry = { workspace = true }
tracing-opentelemetry-instrumentation-sdk = { workspace = true, features = [
    "http",
] }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
] }
uuid = { workspace = true }

[dev-dependencies]
gag = "1.0.0"
googletest = { workspace = true }
log = "0.4.29"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
