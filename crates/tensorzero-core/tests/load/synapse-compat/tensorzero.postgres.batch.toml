# Same as tensorzero.toml, with Postgres batch writes instead of per-request async inserts.

[gateway]
disable_pseudonymous_usage_analytics = true

[gateway.observability]
enabled = true
backend = "postgres"
async_writes = false

[gateway.observability.batch_writes]
enabled = true
flush_interval_ms = 100
max_rows = 500
max_rows_postgres = 500

[postgres]
connection_pool_size = 50

[object_storage]
type = "disabled"

[models.dummy-chat]
routing = ["dummy"]

[models.dummy-chat.providers.dummy]
type = "dummy"
model_name = "good"

[embedding_models.qwen3-embedding-4b]
routing = ["dummy"]

[embedding_models.qwen3-embedding-4b.providers.dummy]
type = "dummy"
model_name = "test-embeddings"

[model_aliases.dummy-chat]
task = "chat"
targets = [{ provider = "dummy", model = "good" }]
