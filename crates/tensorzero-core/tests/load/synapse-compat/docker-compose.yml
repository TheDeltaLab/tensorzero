# Dedicated Postgres for Synapse-compat load tests.
# Host 5432 is commonly taken (other stacks); map to 5433.
# tensorzero/postgres bundles pg_cron + pgvector, required when
# gateway.observability.backend = "postgres".

services:
  postgres:
    image: tensorzero/postgres:16
    environment:
      POSTGRES_DB: tensorzero_load
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    command: ["postgres", "-c", "cron.database_name=tensorzero_load"]
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tensorzero_load"]
      start_period: 10s
      start_interval: 1s
      timeout: 2s
      retries: 30
